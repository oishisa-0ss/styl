<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111614" media="(prefers-color-scheme: dark)">
<meta name="description" content="シャーレの写真から大腸菌のコロニーを自動で数えます。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Ccircle cx='13' cy='13' r='12.5' fill='%23EEF5F1'/%3E%3Cpath d='M13 5c3.5 4.2 5.2 7.2 5.2 9.6a5.2 5.2 0 0 1-10.4 0C7.8 12.2 9.5 9.2 13 5z' fill='%232E7D5B'/%3E%3Ccircle cx='11.2' cy='15.2' r='1.4' fill='%23fff'/%3E%3C/svg%3E">
<title>緑水Webカウンター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --soft:#F2F6F4; --soft-2:#E6EFEA; --ink:#1E2B25; --ink-2:#3C4A43; --muted:#66756D; --line:#E2E9E5;
  --green:#2E7D5B; --green-ink:#FFFFFF; --green-soft:#EEF5F1; --focus:#2E7D5B;
  --warn:#A2551B; --warn-soft:#FBEFE3; --art-bg:#EEF5F1; --stage:#1B2420;
  --ai:#2F6FEB; --add:#E8702A; --off:#9AA5A0;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --num:"Outfit","Zen Maru Gothic","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111614; --soft:#1A211E; --soft-2:#222C27; --ink:#E4ECE8; --ink-2:#C5D0CA; --muted:#93A29A; --line:#26302B;
    --green:#6CC49A; --green-ink:#0E1A14; --green-soft:#1B2A23; --focus:#6CC49A;
    --warn:#E6A36E; --warn-soft:#3A2717; --art-bg:#1B2A23; --stage:#0C100E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111614; --soft:#1A211E; --soft-2:#222C27; --ink:#E4ECE8; --ink-2:#C5D0CA; --muted:#93A29A; --line:#26302B;
  --green:#6CC49A; --green-ink:#0E1A14; --green-soft:#1B2A23; --focus:#6CC49A;
  --warn:#E6A36E; --warn-soft:#3A2717; --art-bg:#1B2A23; --stage:#0C100E;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr,.tl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{display:flex;flex-direction:column;gap:16px;padding-block:14px 0;padding-inline:16px;max-width:560px;margin:0 auto}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:32px;height:32px;flex:none}
.mark .mk-bg{fill:var(--green-soft)} .mark .mk-drop{fill:var(--green)} .mark .mk-hi{fill:var(--bg)}
.mark .mk-drop,.mark .mk-hi{transform-box:view-box;transform-origin:13px 20px;animation:drop .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{from{transform:translateY(-6px) scale(.6);opacity:0}}
.brand h1{margin:0;font-size:16.5px;line-height:1.25;font-weight:700;white-space:nowrap}
.brand .sub{margin:0;font-size:11px;color:var(--muted);white-space:nowrap}
.top-r{display:flex;align-items:center;gap:8px}
.tbtn{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--green-soft);color:var(--green);cursor:pointer}
.tbtn .ic{width:21px;height:21px}
.tbtn:hover{background:var(--soft-2)}

.count{display:grid;gap:8px}
.count-main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.label{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-size:12.5px;color:var(--muted)}
.label .hint{font-size:11px}
.val{position:relative;display:flex;align-items:baseline;gap:6px}
.odo{display:inline-flex;font-family:var(--num);font-weight:600;font-size:72px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.odo .dash{line-height:1;color:var(--line)}
.dg{display:inline-block;height:1em;overflow:hidden}
.strip{display:block;transform:translateY(calc(var(--d,0) * -1em));transition:transform .55s cubic-bezier(.2,.9,.25,1)}
.strip>span{display:block;height:1em;line-height:1}
.unit{font-size:17px;font-weight:700}
.delta-host{position:relative;align-self:flex-start;width:0;height:0}
.delta{position:absolute;left:8px;top:4px;font:600 18px var(--num);white-space:nowrap;animation:rise .9s ease-out forwards}
.delta.up{color:var(--add)} .delta.down{color:var(--off)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}20%{opacity:1}to{opacity:0;transform:translateY(-22px)}}
.edited{align-self:center;font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:3px 11px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:var(--soft);font-size:12px;color:var(--ink-2);white-space:nowrap}
.legend b{font:600 13px var(--num);color:var(--ink);font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;border:2px solid}
.sw.ai{border-color:var(--ai)} .sw.add{border-color:var(--add)} .sw.off{border-color:var(--off);border-style:dashed}

.stage-wrap{display:flex;justify-content:center;min-height:0}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:var(--stage);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stage canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.glass{background:rgba(255,255,255,.93);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.zoom{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:0;padding:3px;border-radius:999px;color:#1E2B25}
.zoom button{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:#1E2B25;cursor:pointer;display:grid;place-items:center}
.zoom button .ic{width:19px;height:19px}
.zoom button:hover:not(:disabled){background:#EEF5F1}
.zoom button:disabled{opacity:.3;cursor:default}
.zoom .lv{min-width:36px;text-align:center;font:600 12.5px "Outfit",sans-serif;font-variant-numeric:tabular-nums}
.ov-btn{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:5px;height:40px;padding:0 14px 0 10px;border:0;border-radius:999px;color:#2E7D5B;font-size:13px;font-weight:700;cursor:pointer}
.ov-btn .ic{width:19px;height:19px}
.ov-btn:hover{background:#fff}
#mini{position:absolute;left:10px;bottom:10px;width:84px;height:84px;border-radius:12px;box-shadow:0 0 0 2px #fff,0 6px 16px rgba(0,0,0,.35);cursor:pointer;animation:fade .2s}
.tip{position:absolute;left:0;top:0;padding:4px 11px;border-radius:999px;background:rgba(20,28,24,.88);color:#fff;font-size:12px;white-space:nowrap;pointer-events:none}
.loupe{position:absolute;left:0;top:0;width:140px;display:grid;justify-items:center;gap:8px;pointer-events:none;animation:lpin .16s ease-out}
.loupe canvas{width:140px;height:140px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 5px rgba(46,125,91,.5),0 14px 30px rgba(0,0,0,.4)}
.loupe span{padding:3px 12px;border-radius:999px;background:rgba(20,28,24,.9);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
@keyframes lpin{from{opacity:0;scale:.7}}
@keyframes fade{from{opacity:0}}
.start,.busy,.err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center}
.start{background:radial-gradient(circle at 50% 38%,var(--bg),var(--green-soft) 78%);color:var(--ink)}
.start-art{width:min(42%,170px);height:auto}
.start-art .sa-dish{fill:#EDE6D3;stroke:#CFC7B2;stroke-width:3}
.start-art .sa-rim{fill:none;stroke:rgba(0,0,0,.08);stroke-width:2}
.start-art .sa-t{fill:#3E7F8A} .start-art .sa-m{fill:#A86A98}
.start-art .sa-scan{fill:none;stroke:var(--green);stroke-width:3.5;stroke-linecap:round;transform-box:view-box;transform-origin:60px 60px;animation:orbit 3.4s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.start-t{margin:0;font-size:15px;font-weight:700}
.start-acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.big-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.big-btn.primary{background:#fff;border-color:#fff;color:#1E2B25}
.start .big-btn{border-color:var(--line);background:var(--bg);color:var(--ink)}
.start .big-btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.big-btn:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.link-btn{border:0;background:none;color:var(--green);font-size:13.5px;font-weight:700;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:6px}
.busy{color:#fff;justify-content:flex-end;padding-bottom:24px;pointer-events:none}
.busy p{margin:0;padding:8px 18px;border-radius:999px;background:rgba(20,28,24,.85);font-size:13.5px}
.busy-bar{position:absolute;inset:0;overflow:hidden;background:rgba(12,16,14,.3)}
.busy-bar i{position:absolute;left:0;right:0;height:80px;background:linear-gradient(to bottom,rgba(214,236,224,0),rgba(214,236,224,.25));border-bottom:2px solid rgba(240,250,245,.9);animation:sweep 1.7s ease-in-out infinite}
@keyframes sweep{from{top:-80px}to{top:100%}}
.err{background:rgba(14,20,17,.86);color:#fff}
.err p{margin:0;font-size:14.5px;line-height:1.75;max-width:30em}
.is-busy .dock,.is-busy .ov-btn,.is-busy .zoom,.is-busy #newBtn{pointer-events:none;opacity:.5}

.hint-line{margin:-4px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:12px;color:var(--muted)}
.hint-line b{color:var(--ink-2);margin-right:5px}

.more{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.more summary{display:flex;align-items:center;gap:8px;cursor:pointer;padding:13px 2px;font-size:14px;color:var(--ink-2);list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary .ic{width:19px;height:19px;color:var(--green)}
.more summary .chev{margin-left:auto;width:18px;height:18px;color:var(--muted);transition:transform .2s}
.more[open] summary .chev{transform:rotate(180deg)}
.more .body{display:grid;gap:14px;padding:2px 2px 18px}
.row{display:grid;gap:6px}
.row label{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.row label b{font:600 15px var(--num);font-variant-numeric:tabular-nums}
.hist{width:100%;height:48px;display:block}
.hist .on{fill:var(--ai);opacity:.85} .hist .cand{fill:var(--ai);opacity:.28} .hist .low{fill:var(--line)}
.hist .th{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:3 2;vector-effect:non-scaling-stroke}
.hist-ax{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.hist-sum{margin:0;font-size:13px;color:var(--ink-2)}
.hist-sum b{font:600 14px var(--num);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--green);margin:0}
.note{margin:0;font-size:12.5px;color:var(--muted);line-height:1.8}
.btn-line{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:14px;color:var(--ink-2);cursor:pointer}
.btn-line .ic{width:18px;height:18px;color:var(--green)}
.btn-line:hover{background:var(--soft)}

.dock{position:sticky;bottom:0;z-index:5;margin-inline:-16px;padding:8px 10px calc(10px + env(safe-area-inset-bottom, 0px));background:var(--bg);border-top:1px solid var(--line)}
.dock-main{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.db{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;padding:4px 2px;border:0;border-radius:16px;background:transparent;color:var(--ink-2);font-size:11.5px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.db .ic{transition:transform .12s}
.db:hover:not(:disabled){background:var(--soft)}
.db:active:not(:disabled) .ic{transform:scale(.88)}
.db:disabled{opacity:.32;cursor:default}
.db[aria-pressed="true"]{color:var(--green);background:var(--green-soft);font-weight:700}
.db.primary{background:var(--green);color:var(--green-ink);font-weight:700}
.db.primary:hover:not(:disabled){background:var(--green);filter:brightness(1.07)}
.db .ants{stroke-dasharray:2.6 2.4}
.db[aria-pressed="true"] .ants{animation:ants .9s linear infinite}
@keyframes ants{to{stroke-dashoffset:-5}}
.badge{position:absolute;top:4px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;font:600 11px/18px var(--num);text-align:center;font-style:normal}
.badge.n{background:var(--soft-2);color:var(--ink-2)}
.badge.hot{background:var(--add);color:#fff}
.dock-review{display:grid;gap:10px;padding:6px 4px 4px;animation:rvin .22s ease-out}
@keyframes rvin{from{opacity:0;transform:translateY(8px)}}
.rv-top{display:flex;align-items:center;gap:10px}
.rv-title{display:flex;align-items:baseline;gap:8px;font-size:14.5px;font-weight:700}
.rv-prog{font:600 14px var(--num);color:var(--muted);font-variant-numeric:tabular-nums}
.rv-score{font-size:12px;color:var(--muted);margin-left:auto}
.rv-exit{border:0;background:var(--soft);color:var(--ink-2);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.rv-track{height:4px;border-radius:2px;background:var(--soft-2);overflow:hidden}
.rv-track i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.rv-q{margin:0;font-size:14.5px}
.rv-acts{display:grid;grid-template-columns:46px 1fr 1fr 46px;gap:8px}
.rv-acts button{min-height:52px;border-radius:16px;border:1.5px solid var(--line);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:700;color:var(--ink-2)}
.rv-acts button:disabled{opacity:.3;cursor:default}
.rv-yes[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.rv-no[aria-pressed="true"]{background:var(--ink-2);border-color:var(--ink-2);color:var(--bg)}
.dish-help{margin:0;font-size:12.5px;color:var(--muted);line-height:1.75}
.dish-acts{display:grid;grid-template-columns:1fr 1fr 1.7fr;gap:8px}
.dish-acts button{min-height:50px;border-radius:999px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-size:14px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.dish-acts .primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.dish-n{margin-left:auto}

.sheet,.coach{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(14,20,17,.55);animation:fade .18s}
.panel,.coach-card{width:100%;max-height:100%;overflow:auto;display:grid;gap:12px;padding:18px;border-radius:22px;background:var(--bg);color:var(--ink);animation:rvin .22s ease-out}
.panel{max-width:560px}
.coach-card{max-width:420px}
.panel h2,.coach-card h2{margin:0;font-size:17px;text-wrap:balance}
.panel img{display:block;width:100%;border-radius:14px}
.fname{font:500 12.5px var(--num);color:var(--muted);word-break:break-all}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.acts a,.acts button{min-height:46px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink-2)}
.acts .ic{width:18px;height:18px}
.acts .primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.acts button:disabled{opacity:.3;cursor:default}
.coach-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.85;min-height:3.7em}
.coach-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.coach-card .src{font-size:12px;color:var(--muted);text-align:center}
.coach-card .src a{color:var(--green)}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--line);transition:width .25s,background .25s}
.dots i.on{width:20px;background:var(--green)}

.art{display:block;width:100%;height:auto;border-radius:16px;background:var(--art-bg)}
.art .plate{fill:#EDE6D3;stroke:#CFC7B2;stroke-width:3}
.art .rim{fill:none;stroke:rgba(0,0,0,.07);stroke-width:2}
.art .t{fill:#3E7F8A} .art .m{fill:#A86A98}
.art .bx{fill:none;stroke-width:2.5}
.art .o{stroke:#2F6FEB} .art .b{stroke:#E8702A}
.art .fing{fill:rgba(46,125,91,.2);stroke:#2E7D5B;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:fing 3.4s infinite}
.art .rip{fill:none;stroke:#2E7D5B;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:rip 3.4s infinite}
.art .fl{font:600 15px "Outfit",sans-serif;opacity:0;animation:fl 3.4s infinite}
.art .bdg{transform-box:fill-box;transform-origin:center;animation:bdg 3.4s infinite}
.art .x-box{stroke:#9AA5A0;stroke-dasharray:4 3;animation:xbox 3.4s infinite}
.art .d-box{stroke:#E8702A;stroke-dasharray:96;animation:draw 3.4s infinite}
.art .zoomg{transform-box:view-box;transform-origin:133px 82px;animation:zoom 3.4s infinite}
.art .f1{animation:f1 3.4s infinite} .art .f2{animation:f2 3.4s infinite}
.art .hold{fill:none;stroke:#2E7D5B;stroke-width:3;stroke-dasharray:107;stroke-dashoffset:0;opacity:0;transform-box:fill-box;transform-origin:center;transform:rotate(-90deg);animation:hold 3.4s infinite}
.art .f4{animation:f4 3.4s infinite}
.art .lp{transform-box:fill-box;transform-origin:50% 100%;animation:lp 3.4s infinite}
.art .l-box{stroke:#2F6FEB;animation:lbox 3.4s infinite}
.art .fl4{animation:fl4 3.4s infinite}
.art .ring{fill:none;stroke:#2E7D5B;stroke-width:3;stroke-dasharray:7 5}
.art .mv{animation:mv 3.4s infinite} .art .mvf{animation:mvf 3.4s infinite}
@keyframes fing{0%{opacity:0;transform:translate(60px,60px)}12%{opacity:1}36%{transform:translate(0,0) scale(1)}41%{transform:translate(0,0) scale(.8)}47%{transform:translate(0,0) scale(1)}72%{opacity:1;transform:translate(0,0)}90%,100%{opacity:0;transform:translate(50px,50px)}}
@keyframes rip{0%,40%{opacity:0;transform:scale(.6)}44%{opacity:.8}66%,100%{opacity:0;transform:scale(2.1)}}
@keyframes fl{0%,45%{opacity:0;transform:translateY(6px)}52%{opacity:1}82%,100%{opacity:0;transform:translateY(-12px)}}
@keyframes bdg{0%,44%{transform:scale(0)}52%{transform:scale(1.25)}58%,100%{transform:scale(1)}}
@keyframes xbox{0%,42%{stroke:#2F6FEB;stroke-dasharray:none}46%,100%{stroke:#9AA5A0;stroke-dasharray:4 3}}
@keyframes draw{0%,44%{stroke-dashoffset:96;opacity:1}62%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes zoom{0%,22%{transform:scale(1)}55%,75%{transform:scale(1.6)}96%,100%{transform:scale(1)}}
@keyframes f1{0%{opacity:0}10%,22%{opacity:1;transform:translate(0,0)}55%{opacity:1;transform:translate(-30px,24px)}70%,100%{opacity:0;transform:translate(-30px,24px)}}
@keyframes f2{0%{opacity:0}10%,22%{opacity:1;transform:translate(0,0)}55%{opacity:1;transform:translate(30px,-24px)}70%,100%{opacity:0;transform:translate(30px,-24px)}}
@keyframes hold{0%,10%{stroke-dashoffset:107;opacity:1}34%{stroke-dashoffset:0;opacity:1}40%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes f4{0%{opacity:0;transform:translate(40px,40px)}10%,70%{opacity:1;transform:translate(0,0)}84%,100%{opacity:0;transform:translate(40px,40px)}}
@keyframes lp{0%,34%{opacity:0;transform:scale(.6)}40%,68%{opacity:1;transform:scale(1)}74%,100%{opacity:0;transform:scale(.9)}}
@keyframes lbox{0%,60%{stroke:#2F6FEB;stroke-dasharray:none}64%,100%{stroke:#9AA5A0;stroke-dasharray:5 4}}
@keyframes fl4{0%,68%{opacity:0;transform:translateY(6px)}74%{opacity:1}94%,100%{opacity:0;transform:translateY(-12px)}}
@keyframes mv{0%,18%{transform:translate(-30px,-16px)}58%,100%{transform:translate(0,0)}}
@keyframes mvf{0%{opacity:0;transform:translate(-30px,-16px)}12%,18%{opacity:1;transform:translate(-30px,-16px)}58%,72%{opacity:1;transform:translate(0,0)}88%,100%{opacity:0;transform:translate(0,0)}}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom, 0px));z-index:40;transform:translateX(-50%);max-width:calc(100% - 32px);padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (min-width:900px){
  .app{max-width:1280px;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto auto auto auto auto 1fr;column-gap:36px;row-gap:20px;padding-block:22px}
  .stage-wrap{grid-column:1;grid-row:1 / -1;align-items:center}
  .stage{width:min(100%, calc(100vh - 44px))}
  @supports (height:100dvh){ .stage{width:min(100%, calc(100dvh - 44px))} }
  .top{grid-column:2;grid-row:1} .count{grid-column:2;grid-row:2}
  .dock{grid-column:2;grid-row:3;position:static;margin:0;padding:8px 0;border-top:0}
  .hint-line{grid-column:2;grid-row:4;justify-content:flex-start;margin:0}
  .more{grid-column:2;grid-row:5;align-self:start}
  .toast{bottom:28px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1.6-2.2h5.4L16.3 7h2.2A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.8" r="3.4"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m20.5 16-5-5-8.5 8.5"/></symbol>

  <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3.5v11"/><path d="m7.5 10 4.5 4.5 4.5-4.5"/><path d="M5 20h14"/></symbol>

  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M5 15a8 8 0 1 0 1.8-8.3L4 10"/></symbol>
</svg>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 26 26" aria-hidden="true"><circle class="mk-bg" cx="13" cy="13" r="12.5"/><path class="mk-drop" d="M13 5c3.5 4.2 5.2 7.2 5.2 9.6a5.2 5.2 0 0 1-10.4 0C7.8 12.2 9.5 9.2 13 5z"/><circle class="mk-hi" cx="11.2" cy="15.2" r="1.4"/></svg>
      <div><h1>Webカウンター</h1><p class="sub">大腸菌コロニーの計数</p></div>
    </div>
    <div class="top-r">
      <button type="button" class="tbtn" id="newBtn" aria-label="新しい写真" hidden><svg class="ic"><use href="#i-camera"/></svg><span class="tl">新しい写真</span></button>
      <button type="button" class="tbtn" id="helpBtn" aria-label="使い方"><svg class="ic"><use href="#i-help"/></svg><span class="tl">使い方</span></button>
    </div>
  </header>

  <section class="count" aria-label="数えた結果">
    <div class="count-main">
      <div>
        <div class="label">大腸菌数<span class="hint">XM-G・青いコロニー</span></div>
        <div class="val"><span class="odo" id="odo" aria-hidden="true"></span><span class="unit">個</span><span class="delta-host" id="deltaHost"></span></div>
        <span class="sr" id="totalSr" aria-live="polite"></span>
      </div>
      <span class="edited" id="edited" hidden>手修正あり</span>
    </div>
    <div class="legend">
      <span><i class="sw ai"></i>AI検出<b id="nAi">0</b></span>
      <span><i class="sw off"></i>除外<b id="nOff">−0</b></span>
      <span><i class="sw add"></i>追加<b id="nAdd">＋0</b></span>
    </div>
  </section>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="cv" role="img" aria-label="シャーレの写真と検出枠。枠をタップすると除外、何もない所をタップすると追加します。"></canvas>
      <button type="button" class="ov-btn glass" id="dishBtn" title="シャーレの円の位置と大きさを直す"><svg class="ic"><use href="#i-dish"/></svg>範囲を直す</button>
      <div class="zoom glass" id="zoomBar">
        <button type="button" id="zout" aria-label="縮小"><svg class="ic"><use href="#i-minus"/></svg></button>
        <span class="lv" id="zlv">×1</span>
        <button type="button" id="zin" aria-label="拡大"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button type="button" id="zfit" aria-label="全体を表示"><svg class="ic"><use href="#i-fit"/></svg></button>
      </div>
      <canvas id="mini" aria-label="全体図。押すとその場所へ移動します" hidden></canvas>
      <div class="tip" id="tip" hidden></div>
      <div class="loupe" id="loupeWrap" hidden><canvas id="loupe"></canvas><span id="loupeLabel"></span></div>
      <div class="start" id="start">
        <svg class="start-art" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="50" class="sa-dish"/><circle cx="60" cy="60" r="43" class="sa-rim"/>
          <circle cx="44" cy="46" r="5" class="sa-t"/><circle cx="72" cy="40" r="3.5" class="sa-m"/><circle cx="70" cy="72" r="6" class="sa-t"/><circle cx="44" cy="76" r="3" class="sa-m"/><circle cx="84" cy="58" r="3.5" class="sa-t"/>
          <path class="sa-scan" d="M60 10a50 50 0 0 1 50 50"/>
        </svg>
        <p class="start-t">シャーレを真上から撮ってください</p>
        <div class="start-acts">
          <label class="big-btn primary" for="camIn"><svg class="ic"><use href="#i-camera"/></svg>写真を撮る</label>
          <label class="big-btn" for="fileIn"><svg class="ic"><use href="#i-image"/></svg>写真を選ぶ</label>
        </div>
        <button type="button" class="link-btn" id="sampleBtn">サンプルの写真で試す</button>
        <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
        <input type="file" id="fileIn" accept="image/*" hidden>
      </div>
      <div class="busy" id="busy" hidden>
        <div class="busy-bar"><i></i></div>
        <p id="busyText">シャーレを探しています…</p>
      </div>
      <div class="err" id="err" hidden>
        <p id="errText"></p>
        <div class="start-acts"><button type="button" class="big-btn primary" id="retryBtn">もう一度</button><button type="button" class="big-btn" id="errBack">写真を選び直す</button></div>
      </div>
    </div>
  </div>

  <p class="hint-line" id="hintLine"></p>

  <details class="more">
    <summary><svg class="ic"><use href="#i-sliders"/></svg>詳細設定<svg class="ic chev"><use href="#i-down"/></svg></summary>
    <div class="body">
      <div class="row">
        <label for="conf">AIの判定の厳しさ（conf）<b id="confV">0.45</b></label>
        <svg class="hist" id="hist" viewBox="0 0 190 46" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="hist-ax"><span>低い</span><span>確信度</span><span>高い</span></div>
        <input type="range" id="conf" min="0.05" max="0.70" step="0.05" value="0.45">
        <p class="hist-sum" id="histSum"></p>
        <p class="note">線より右の枠を数えます。下げると淡いコロニーも拾い、上げると確かなものだけを数えます。</p>
      </div>
      <button type="button" class="btn-line" id="reset"><svg class="ic"><use href="#i-reset"/></svg>AIの結果に戻す</button>
      <p class="note">検出結果は自動処理によるもので、正確さを保証するものではありません。</p>
    </div>
  </details>

  <nav class="dock" aria-label="操作">
    <div class="dock-main" id="dockMain">
      <button type="button" class="db" id="undo" title="元に戻す（Ctrl+Z）" disabled><svg class="ic"><use href="#i-undo"/></svg><span>元に戻す</span></button>
      <button type="button" class="db" id="redo" title="やり直し（Ctrl+Y）" disabled><svg class="ic"><use href="#i-redo"/></svg><span>やり直し</span></button>
      <button type="button" class="db" id="candBtn" aria-pressed="false" title="AIが迷った枠を点線で表示"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect class="ants" x="4" y="4" width="16" height="16" rx="1.5"/><circle cx="12" cy="12" r="2.2"/></svg><span>候補</span><i class="badge n" id="candN">0</i></button>
      <button type="button" class="db" id="rvBtn" title="迷いやすい枠を1つずつ確認"><svg class="ic"><use href="#i-review"/></svg><span>見直し</span><i class="badge hot" id="rvBadge">0</i></button>
      <button type="button" class="db primary" id="save"><svg class="ic"><use href="#i-save"/></svg><span>保存</span></button>
    </div>
    <div class="dock-review" id="dockReview" hidden>
      <div class="rv-top">
        <div class="rv-title"><b>見直し</b><span class="rv-prog"><span id="rvI">1</span> / <span id="rvN">1</span></span></div>
        <span class="rv-score" id="rvScore"></span>
        <button type="button" class="rv-exit" id="rvExit">終わる</button>
      </div>
      <div class="rv-track"><i id="rvFill"></i></div>
      <p class="rv-q">この枠は大腸菌のコロニーですか？</p>
      <div class="rv-acts">
        <button type="button" id="rvPrev" aria-label="前の枠"><svg class="ic"><use href="#i-left"/></svg></button>
        <button type="button" class="rv-no" id="rvNo" aria-pressed="false"><svg class="ic"><use href="#i-x"/></svg>数えない</button>
        <button type="button" class="rv-yes" id="rvYes" aria-pressed="false"><svg class="ic"><use href="#i-check"/></svg>数える</button>
        <button type="button" id="rvNext" aria-label="次の枠"><svg class="ic"><use href="#i-right"/></svg></button>
      </div>
    </div>
    <div class="dock-review" id="dockDish" hidden>
      <div class="rv-top"><b class="rv-title">シャーレの範囲</b><span class="dish-n rv-score" id="dishN"></span></div>
      <p class="dish-help" id="dishHelp"></p>
      <div class="dish-acts">
        <button type="button" id="dishAuto">自動に戻す</button>
        <button type="button" id="dishCancel">やめる</button>
        <button type="button" class="primary" id="dishOk"><svg class="ic"><use href="#i-check"/></svg>この範囲で数える</button>
      </div>
    </div>
  </nav>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT" hidden>
  <div class="panel">
    <h2 id="sheetT">保存する画像</h2>
    <img id="outImg" alt="枠と件数を書き込んだ結果画像">
    <div class="fname" id="outName"></div>
    <p class="note" id="outNote"></p>
    <div class="acts">
      <button type="button" id="sheetClose">閉じる</button>
      <button type="button" id="outShare" hidden><svg class="ic"><use href="#i-share"/></svg>共有</button>
      <a id="outDl" class="primary" hidden><svg class="ic"><use href="#i-save"/></svg>保存</a>
    </div>
  </div>
</div>

    <p id="coachP"></p>

      <div class="dots" id="dots"><i></i><i></i><i></i><i></i><i></i></div>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
